name: Matrix strategy
on: 
  push:
  workflow_dispatch:

jobs:
    deploy:
        strategy:
            matrix:
                os: [ubuntu-latest, ubuntu-22.04, windows-latest]
                images: [hello-world, alpine]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Echo Eocker Details
              run: docker info

            - name: Run Images on ${{ matrix.os }}
              run: docker run ${{ matrix.images }}
