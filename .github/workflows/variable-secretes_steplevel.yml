name: variable secretes step level workflow
on: push

jobs:
############## enviroment variables at STEP level ################

    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Docker Build
              env:
                CONTAINER_REGISTRY: docker.io
                DOCKER_USERNAME: siddharth1
                IMAGE_NAME: github-actions-nginx
              run: echo docker build -t $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest
            # run: echo docker build -t ${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            
            - name: Docker Login
              env:
                DOCKER_USERNAME: siddharth1
                DOCKER_PASSWORD: s3cUrePaSsw0rd
              run: echo docker login --username=$DOCKER_USERNAME --password=${{ env.DOCKER_PASSWORD }}
            
            - name: Docker Publish
              run: echo docker push docker.io/$DOCKER_USERNAME/$IMAGE_NAME:latest
    deploy:
        needs: docker
        runs-on: ubuntu-latest
        steps:
            - name: Docker Run
              env:
                CONTAINER_REGISTRY: docker.io
                DOCKER_USERNAME: siddharth1
                IMAGE_NAME: github-actions-nginx
              run: echo docker run -d -p 8080:80 $ONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest