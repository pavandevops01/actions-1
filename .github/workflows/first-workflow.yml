name: My First Workflow
on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v7

            - name: List and Read file
              run: |
                echo "My first gihub actions job"
                ls -ltra
                cat README.md

            - name: Generate ASCII Artwork
              run: cowsay -f cat "Run for cover, I am a CAT...meow" >> cat.txt
                   