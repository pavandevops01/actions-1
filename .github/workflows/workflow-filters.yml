name: Exploring worflow filters and activity types

on:
 workflow_dispatch:
 schedule:
    - cron: "*/59 * * * *"
 push:
    branches:
        - main
        - '!feature/*'   # ignoring pushin to any branch name starting with feature using !
    # branches_ignore:
    #     - feature/*      # feature/add-music, feature/updateImages
    #     - test/**     # testing/ui/index, test/checkout/payment/

 pull_request:
    types:
        - opened
        - closed
    paths-ignore:   # workflow will only run when a pull request that includes a change on any file other that README.md
        - README.md
    branches:
        - main  # configure your workflow to only run on pull requests that trigger specific branches.

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "This job ran for event type: ${{ github.event_name }}"'