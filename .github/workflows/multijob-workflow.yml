name: ascii art multijob workflow
on: push

jobs:
    build_job_1:
        runs-on: ubuntu-latest
        steps:
          - name: Install cowsay Program
            run: sudo apt-get install cowsay -y
        
          - name: Execute cowsay CMD
            run: cowsay -f dragon "Run for cover, I am a DRAGON...DRAWNNN" >> dragon.txt

          - name: sleep for 10 seconds
            run: sleep 10

    test_job_2:
        needs: build_job_1
        runs-on: ubuntu-latest
        steps:
          - name: sleep for 10 seconds
            run: sleep 10
          
          - name: Test File Exists
            run: grep -i "dragon" dragon.txt

    deploy_job_3:
    #   needs: [test_job_2]
    #   needs: [build_job_1,test_job_2]
        needs: test_job_2
        runs-on: ubuntu-latest
        steps:
            - name: Read File
              run: cat dragon.txt
          
